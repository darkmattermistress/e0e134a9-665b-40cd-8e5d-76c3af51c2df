name: Build Secure Policy Plugin

on:
  workflow_dispatch:
    inputs:
      bifrost_version:
        description: "Target Bifrost version (e.g. ent-v2.2.3 or 2.2.3)"
        required: true

permissions:
  contents: write

concurrency:
  group: build-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve Bifrost release deps
        env:
          INPUT_VERSION: ${{ inputs.bifrost_version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION#ent-}"
          V="${V#v}"
          ENT_VERSION="ent-v${V}"
          URL="https://docs.getbifrost.ai/changelogs/${ENT_VERSION}.md"
          echo "Fetching ${URL}"
          curl -sL --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/changelog.md

          DEPS_BLOCK="$(sed -n '/```go/,/^```$/p' /tmp/changelog.md | sed '1d;$d')"
          GO_VERSION="$(printf '%s\n' "$DEPS_BLOCK" | grep -E '^[[:space:]]*go [0-9]' | head -1 | awk '{print $2}')"
          DEPS_CORE="$(printf '%s\n' "$DEPS_BLOCK" | grep -E '^[[:space:]]*github\.com/maximhq/bifrost/core[[:space:]]' | head -1 | awk '{print $2}')"
          BASE_CORE="$(grep -A 3 'Base OSS version' /tmp/changelog.md | grep -oE 'core[[:space:]]+`v[0-9]+\.[0-9]+\.[0-9]+`' | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"

          [ -n "$GO_VERSION" ] || { echo "::error::could not parse go version from the changelog deps block"; exit 1; }
          [ -n "$DEPS_CORE" ] || { echo "::error::could not parse bifrost/core from the changelog deps block"; exit 1; }

          echo "plugin-deps block : go ${GO_VERSION}, bifrost/core ${DEPS_CORE}"
          echo "Base OSS section  : bifrost/core ${BASE_CORE:-(not found)}"

          if [ -n "$BASE_CORE" ] && [ "$DEPS_CORE" != "$BASE_CORE" ]; then
            echo "::warning::changelog contradicts itself: plugin-deps block says ${DEPS_CORE}, Base OSS section says ${BASE_CORE}. Building BOTH variants — upload the one your gateway loads (the core tag in the filename tells them apart). If the first fails to load, upload the other."
            CORE_VARIANTS="${DEPS_CORE} ${BASE_CORE}"
          else
            CORE_VARIANTS="${BASE_CORE:-$DEPS_CORE}"
          fi

          echo "GO_VERSION=${GO_VERSION}" >> "$GITHUB_ENV"
          echo "ENT_VERSION=${ENT_VERSION}" >> "$GITHUB_ENV"
          echo "CORE_VARIANTS=${CORE_VARIANTS}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build plugin variants (golang container — glibc parity with gateway)
        run: |
          set -euo pipefail
          REF_SO="${GITHUB_WORKSPACE}/build/secure-policy-plugin.so"
          if [ ! -f "$REF_SO" ]; then
            echo "::warning::known-good reference artifact ${REF_SO} not found — glibc guard skipped"
            REF_SO=""
          fi
          ORIGINAL_MODULE="$(grep -E '^module ' secure-policy-plugin/go.mod | awk '{print $2}')"
          BUILD_STAMP="${GITHUB_RUN_NUMBER:-$(date +%Y%m%d%H%M%S)}"
          for CORE in ${CORE_VARIANTS}; do
            CORE_TAG="$(printf '%s' "$CORE" | tr -d 'v.')"
            OUT="build/secure-policy-plugin-${ENT_VERSION}-core${CORE_TAG}.so"
            VARIANT_MODULE="${ORIGINAL_MODULE}/${ENT_VERSION}-core${CORE_TAG}-${BUILD_STAMP}"
            NAME_STAMP="secure-policy-plugin-anthfix-${ENT_VERSION}-core${CORE_TAG}-${BUILD_STAMP}"
            echo "==> building variant: bifrost/core ${CORE} -> ${OUT}"
            echo "    module identity: ${VARIANT_MODULE} (unique per build)"
            echo "    plugin name    : ${NAME_STAMP} (unique per build — Bifrost keys plugin status by GetName())"

            (
              cd secure-policy-plugin
              go mod edit -module "${VARIANT_MODULE}"
              go mod edit -require="github.com/maximhq/bifrost/core@${CORE}"
              go mod edit -go="${GO_VERSION}"
              go mod tidy
              go mod vendor
              sed -i -E "s|^(BIFROST_CORE[[:space:]]*:=).*$|\1 ${CORE}|" Makefile
              sed -i -E "s|^(GO_VERSION[[:space:]]*:=).*$|\1 ${GO_VERSION}|" Makefile
              mkdir -p build
              docker run --rm \
                -v "$PWD":/plugin \
                -w /plugin \
                "golang:${GO_VERSION}" \
                sh -c "GOOS=linux GOARCH=amd64 CGO_ENABLED=1 GOAMD64=v1 \
                  go build -trimpath -buildmode=plugin -mod=vendor \
                  -ldflags \"-X main.pluginName=${NAME_STAMP}\" \
                  -o build/secure-policy-plugin-anthfix.so . && strip build/secure-policy-plugin-anthfix.so"
            )

            SO="secure-policy-plugin/build/secure-policy-plugin-anthfix.so"
            ACTUAL_CORE="$(go version -m "$SO" | grep -E 'dep[[:space:]]+github\.com/maximhq/bifrost/core' | head -1 | awk '{print $3}')"
            [ "$ACTUAL_CORE" = "$CORE" ] || { echo "::error::${OUT}: embedded core ${ACTUAL_CORE} != expected ${CORE}"; exit 1; }
            ACTUAL_PATH="$(go version -m "$SO" | grep -E '^	path' | awk '{print $2}')"
            [ "$ACTUAL_PATH" = "$VARIANT_MODULE" ] || { echo "::error::${OUT}: embedded module path '${ACTUAL_PATH}' != expected '${VARIANT_MODULE}'"; exit 1; }

            mkdir -p build
            cp "$SO" "$OUT"

            if [ -n "$REF_SO" ]; then
              EXTRA="$(comm -13 \
                <(objdump -T "$REF_SO" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -u) \
                <(objdump -T "$OUT" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -u))"
              if [ -n "$EXTRA" ]; then
                echo "::error::${OUT} requires glibc symbol versions the known-good artifact does not: $(echo "$EXTRA" | tr '\n' ' '). A gateway that loads the known-good artifact will fail to load this build."
                exit 1
              fi
            fi

            echo "variant OK: ${OUT} (embedded bifrost/core ${ACTUAL_CORE}, module ${VARIANT_MODULE})"
          done

          (
            cd secure-policy-plugin
            go mod edit -module "${ORIGINAL_MODULE}"
            go mod tidy
            go mod vendor
          )
          ls -la build/

      - name: Commit artifacts and aligned deps
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/ secure-policy-plugin/go.mod secure-policy-plugin/go.sum secure-policy-plugin/Makefile
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "build: secure-policy-plugin-${ENT_VERSION} (go ${GO_VERSION}, bifrost/core variants: ${CORE_VARIANTS})"
            git push
          fi
